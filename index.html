<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMILES Structure Viewer</title>
  <script src="./smiles-drawer.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #63706a;
      --line: #d9e2dd;
      --panel: #ffffff;
      --wash: #f5f8f6;
      --accent: #0b7f63;
      --accent-strong: #075f4b;
      --error: #b23a3a;
      --shadow: 0 18px 55px rgba(28, 48, 40, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(145deg, rgba(11, 127, 99, 0.10), transparent 38%),
        linear-gradient(315deg, rgba(181, 217, 204, 0.45), transparent 42%),
        var(--wash);
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .app-shell {
      display: grid;
      gap: 22px;
    }

    header {
      display: grid;
      gap: 10px;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(2rem, 5vw, 4.25rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .intro {
      margin: 0;
      max-width: 660px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(320px, 1.1fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel,
    .result {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(217, 226, 221, 0.9);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 22px;
      border-radius: 8px;
      display: grid;
      align-content: start;
      gap: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      color: var(--ink);
      background: #fbfdfc;
      font: 1rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(11, 127, 99, 0.14);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    button:hover {
      background: var(--accent-strong);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
      transform: none;
    }

    .pubchem-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      color: var(--accent-strong);
      background: #fff;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 750;
      text-decoration: none;
      transition: border-color 160ms ease, color 160ms ease;
    }

    .pubchem-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pubchem-link[hidden] {
      display: none;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.45;
    }

    .status.error {
      color: var(--error);
    }

    .result {
      border-radius: 8px;
      overflow: hidden;
      min-height: 470px;
      display: grid;
      grid-template-rows: minmax(320px, 1fr) auto;
    }

    .structure-stage {
      display: grid;
      place-items: center;
      min-height: 320px;
      padding: 20px;
      background:
        linear-gradient(rgba(23, 33, 29, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 29, 0.045) 1px, transparent 1px),
        #ffffff;
      background-size: 28px 28px;
    }

    svg {
      width: min(100%, 560px);
      max-height: 430px;
      aspect-ratio: 1 / 0.72;
      background: #ffffff;
      border-radius: 6px;
    }

    .empty-state {
      max-width: 330px;
      color: var(--muted);
      line-height: 1.55;
      text-align: center;
    }

    .name-card {
      border-top: 1px solid var(--line);
      padding: 18px 20px 20px;
      background: rgba(250, 252, 251, 0.96);
    }

    .name-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .iupac-name {
      margin: 0;
      min-height: 28px;
      overflow-wrap: anywhere;
      font-size: clamp(1.05rem, 2.2vw, 1.45rem);
      line-height: 1.35;
      font-weight: 750;
    }

    @media (max-width: 780px) {
      main {
        width: min(100% - 24px, 620px);
        padding: 28px 0;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .result {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="app-shell">
      <header>
        <h1>SMILES Structure Viewer</h1>
        <p class="intro">Enter a SMILES string to draw the molecular structure and look up its English IUPAC systematic name.</p>
      </header>

      <section class="workspace" aria-label="SMILES drawing tool">
        <form class="panel" id="smiles-form">
          <div>
            <label for="smiles-input">SMILES</label>
            <textarea id="smiles-input" spellcheck="false" autocomplete="off" placeholder="Example: CCO">CCO</textarea>
          </div>
          <div class="controls">
            <button type="submit" id="draw-button">Draw structure</button>
            <a class="pubchem-link" id="pubchem-link" href="#" target="_blank" rel="noopener" hidden>Open in PubChem</a>
          </div>
          <div class="status" id="status" role="status" aria-live="polite">Ready.</div>
        </form>

        <section class="result" aria-label="Molecule result">
          <div class="structure-stage" id="structure-stage">
            <svg id="structure-svg" width="760" height="540" role="img" aria-label="Molecular structure drawing"></svg>
            <p class="empty-state" id="empty-state" hidden>Draw a molecule to see its structure here.</p>
          </div>
          <div class="name-card">
            <p class="name-label">IUPAC name</p>
            <p class="iupac-name" id="iupac-name">ethanol</p>
          </div>
        </section>
      </section>
    </div>
  </main>

  <script>
    const form = document.querySelector("#smiles-form");
    const input = document.querySelector("#smiles-input");
    const drawButton = document.querySelector("#draw-button");
    const pubchemLink = document.querySelector("#pubchem-link");
    const statusEl = document.querySelector("#status");
    const nameEl = document.querySelector("#iupac-name");
    const structureSvg = document.querySelector("#structure-svg");
    const emptyState = document.querySelector("#empty-state");

    const drawer = new SmilesDrawer.SvgDrawer({
      width: 760,
      height: 540,
      padding: 34,
      bondThickness: 1.8,
      atomVisualization: "default",
      terminalCarbons: false,
      explicitHydrogens: false
    });

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function hidePubChemLink() {
      pubchemLink.hidden = true;
      pubchemLink.removeAttribute("href");
    }

    function showPubChemLink(cid) {
      pubchemLink.href = `https://pubchem.ncbi.nlm.nih.gov/compound/${encodeURIComponent(cid)}`;
      pubchemLink.hidden = false;
    }

    function clearCanvas() {
      structureSvg.replaceChildren();
    }

    function drawSmiles(smiles) {
      return new Promise((resolve, reject) => {
        SmilesDrawer.parse(smiles, (tree) => {
          clearCanvas();
          drawer.draw(tree, "structure-svg", "light");
          emptyState.hidden = true;
          structureSvg.hidden = false;
          resolve();
        }, (error) => {
          clearCanvas();
          reject(error);
        });
      });
    }

    async function fetchPubChemRecord(smiles) {
      const response = await fetch("https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/smiles/property/IUPACName/JSON", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: new URLSearchParams({ smiles })
      });

      if (!response.ok) {
        throw new Error("PubChem did not return a match.");
      }

      const data = await response.json();
      const record = data?.PropertyTable?.Properties?.[0];
      return {
        cid: record?.CID || "",
        iupacName: record?.IUPACName || ""
      };
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const smiles = input.value.trim();

      if (!smiles) {
        setStatus("Please enter a SMILES string.", true);
        hidePubChemLink();
        return;
      }

      drawButton.disabled = true;
      hidePubChemLink();
      nameEl.textContent = "Looking up name...";
      setStatus("Drawing structure...");

      try {
        await drawSmiles(smiles);
      } catch (error) {
        nameEl.textContent = "No structure drawn";
        setStatus("That SMILES string could not be drawn. Please check the input.", true);
        hidePubChemLink();
        drawButton.disabled = false;
        return;
      }

      setStatus("Structure drawn. Looking up IUPAC name...");

      try {
        const { cid, iupacName } = await fetchPubChemRecord(smiles);
        nameEl.textContent = iupacName || "IUPAC name not found";
        if (cid) {
          showPubChemLink(cid);
        }
        setStatus(iupacName ? "Done." : "Structure drawn, but no IUPAC name was found.");
      } catch (error) {
        nameEl.textContent = "IUPAC name not found";
        hidePubChemLink();
        setStatus("Structure drawn, but the online name lookup is unavailable.", true);
      } finally {
        drawButton.disabled = false;
      }
    }

    form.addEventListener("submit", handleSubmit);
    window.addEventListener("load", () => form.requestSubmit());
  </script>
</body>
</html>
